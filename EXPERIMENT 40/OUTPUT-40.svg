<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390"><rect width="1100" height="390" rx="12" fill="#0d1117"/><rect width="1100" height="42" rx="12" fill="#21262d"/><circle cx="22" cy="21" r="6" fill="#ff5f56"/><circle cx="44" cy="21" r="6" fill="#ffbd2e"/><circle cx="66" cy="21" r="6" fill="#27c93f"/><text x="550" y="27" fill="#c9d1d9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">OS EXPERIMENT 40 — SAMPLE CONSOLE OUTPUT</text><text x="28" y="70" fill="#8bd5ca" font-family="Consolas,monospace" font-size="16">$ gcc CODE -o exp40</text><text x="28" y="95" fill="#8bd5ca" font-family="Consolas,monospace" font-size="16">$ ./exp40</text><text x="28" y="120" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">File created successfully.</text><text x="28" y="145" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Current permissions: 644</text><text x="28" y="170" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">File permissions changed successfully.</text><text x="28" y="195" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Updated permissions: 664</text><text x="28" y="220" fill="#e6edf3" font-family="Consolas,monospace" font-size="16"> </text><text x="28" y="245" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Linux permission commands:</text><text x="28" y="270" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">ls -l file.txt</text><text x="28" y="295" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">chmod g+w file.txt</text><text x="28" y="320" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">chown username file.txt</text><text x="28" y="345" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">chgrp groupname file.txt</text></svg>