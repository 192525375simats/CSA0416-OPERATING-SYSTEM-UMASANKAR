<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="515" viewBox="0 0 1100 515"><rect width="1100" height="515" rx="12" fill="#0d1117"/><rect width="1100" height="42" rx="12" fill="#21262d"/><circle cx="22" cy="21" r="6" fill="#ff5f56"/><circle cx="44" cy="21" r="6" fill="#ffbd2e"/><circle cx="66" cy="21" r="6" fill="#27c93f"/><text x="550" y="27" fill="#c9d1d9" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">OS EXPERIMENT 36 — SAMPLE CONSOLE OUTPUT</text><text x="28" y="70" fill="#8bd5ca" font-family="Consolas,monospace" font-size="16">$ gcc CODE -o exp36</text><text x="28" y="95" fill="#8bd5ca" font-family="Consolas,monospace" font-size="16">$ ./exp36</text><text x="28" y="120" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Linked Allocation Simulation</text><text x="28" y="145" fill="#e6edf3" font-family="Consolas,monospace" font-size="16"> </text><text x="28" y="170" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">W - Write a block</text><text x="28" y="195" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">R - Read a block</text><text x="28" y="220" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Q - Quit</text><text x="28" y="245" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Enter your choice: W</text><text x="28" y="270" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Enter data for the block: First block</text><text x="28" y="295" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Block 1 created successfully.</text><text x="28" y="320" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Enter your choice: W</text><text x="28" y="345" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Enter data for the block: Second block</text><text x="28" y="370" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Block 2 created successfully.</text><text x="28" y="395" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Enter your choice: R</text><text x="28" y="420" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Enter block number to read (1-2): 2</text><text x="28" y="445" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Block 2 Data: Second block</text><text x="28" y="470" fill="#e6edf3" font-family="Consolas,monospace" font-size="16">Enter your choice: Q</text></svg>